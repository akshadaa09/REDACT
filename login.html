<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>REDACT | Privacy Intelligence Engine Login</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Hanken+Grotesk:wght@600;700;900&amp;family=Geist:wght@400;500&amp;display=swap" rel="stylesheet"/>
  
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-primary": "#690007",
            "surface-dim": "#131315",
            "on-error": "#690005",
            "error": "#ffb4ab",
            "on-secondary-fixed-variant": "#46464e",
            "on-tertiary-fixed-variant": "#454747",
            "on-secondary-container": "#bcbbc5",
            "on-surface": "#e5e1e4",
            "surface-container": "#201f21",
            "tertiary-container": "#4c4e4f",
            "outline": "#a88a86",
            "tertiary-fixed": "#e2e2e2",
            "secondary-fixed": "#e3e1ec",
            "primary-fixed-dim": "#ffb4ac",
            "primary-fixed": "#ffdad6",
            "surface-container-lowest": "#0e0e10",
            "background": "#131315",
            "secondary-container": "#4a4b53",
            "on-tertiary-container": "#bfc0c0",
            "tertiary": "#c6c6c7",
            "on-background": "#e5e1e4",
            "on-tertiary": "#2f3131",
            "surface-container-high": "#2a2a2c",
            "tertiary-fixed-dim": "#c6c6c7",
            "inverse-surface": "#e5e1e4",
            "secondary": "#c6c5cf",
            "surface-tint": "#ffb4ac",
            "on-primary-fixed": "#410002",
            "on-secondary-fixed": "#1a1b22",
            "surface-variant": "#353437",
            "surface-bright": "#39393b",
            "inverse-primary": "#b02d29",
            "surface-container-low": "#1c1b1d",
            "on-surface-variant": "#e1bfbb",
            "secondary-fixed-dim": "#c6c5cf",
            "on-secondary": "#2f3038",
            "on-error-container": "#ffdad6",
            "error-container": "#93000a",
            "outline-variant": "#59413e",
            "primary": "#ffb4ac",
            "primary-container": "#991b1b",
            "on-tertiary-fixed": "#1a1c1c",
            "surface-container-highest": "#353437",
            "on-primary-container": "#ffaaa1",
            "surface": "#131315",
            "inverse-on-surface": "#313032",
            "on-primary-fixed-variant": "#8e1214"
          },
          "borderRadius": {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          "spacing": {
            "margin-mobile": "16px",
            "gutter": "16px",
            "container-max-width": "1280px",
            "margin-desktop": "40px",
            "unit": "4px"
          },
          "fontFamily": {
            "terminal-sm": ["JetBrains Mono"],
            "label-caps": ["JetBrains Mono"],
            "body-md": ["Geist"],
            "headline-lg": ["Hanken Grotesk"],
            "headline-lg-mobile": ["Hanken Grotesk"],
            "display-lg": ["Hanken Grotesk"]
          },
          "fontSize": {
            "terminal-sm": ["13px", {"lineHeight": "1.4", "letterSpacing": "0.02em", "fontWeight": "500"}],
            "label-caps": ["11px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700"}],
            "body-md": ["16px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
            "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
            "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
            "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "700"}]
          }
        },
      },
    }
  </script>
  
  <style>
    body {
      background-color: #0A0A0C;
      color: #e5e1e4;
      min-height: 100vh;
    }
    .zinc-outline {
      border: 1px solid #27272A;
    }
    .scanline {
      height: 1px;
      background: #991B1B;
      position: absolute;
      width: 100%;
      top: 0;
      animation: scan 4s linear infinite;
      opacity: 0.2;
    }
    @keyframes scan {
      0% { top: 0%; }
      100% { top: 100%; }
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .cyber-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(39, 39, 42, 0.2) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(39, 39, 42, 0.2) 1px, transparent 1px);
    }
  </style>
</head>
<body class="font-body-md text-body-md selection:bg-primary-container selection:text-on-primary-container flex items-center justify-center relative overflow-hidden cyber-grid">
  
  <!-- Fixed scanline across screen -->
  <div class="fixed top-0 left-0 w-full h-full pointer-events-none opacity-5 mix-blend-overlay bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
  
  <!-- Main Container -->
  <div class="w-full max-w-md mx-margin-mobile relative z-10 px-4">
    <!-- Brand Header -->
    <div class="text-center mb-8 flex flex-col items-center justify-center">
      <div class="flex items-center gap-2 mb-2">
        <span class="material-symbols-outlined text-primary text-4xl">shield</span>
        <span class="font-display-lg text-on-surface tracking-tighter uppercase">REDACT</span>
      </div>
      <p class="font-label-caps text-secondary-container tracking-widest text-xs">PRIVACY INTELLIGENCE ENGINE</p>
    </div>

    <!-- Login Card -->
    <div class="zinc-outline bg-surface-container p-8 relative overflow-hidden group">
      <!-- Glow effect top border -->
      <div class="scanline"></div>
      
      <!-- Top corners styling -->
      <div class="absolute top-0 left-0 w-2 h-2 border-t border-l border-primary"></div>
      <div class="absolute top-0 right-0 w-2 h-2 border-t border-r border-primary"></div>
      <div class="absolute bottom-0 left-0 w-2 h-2 border-b border-l border-primary"></div>
      <div class="absolute bottom-0 right-0 w-2 h-2 border-b border-r border-primary"></div>
      
      <div class="mb-8">
        <h2 class="font-headline-lg-mobile text-on-surface mb-2 tracking-tight">IDENTITY ENFORCEMENT</h2>
        <p class="font-terminal-sm text-secondary">A secure authentication session is required to initialize the footprint matrix analyzer.</p>
      </div>

      <!-- Action Area -->
      <div class="space-y-6">
        <a href="/auth/google" class="w-full flex items-center justify-center gap-3 py-4 bg-primary-container hover:bg-primary hover:text-on-primary transition-all duration-300 group/btn border border-primary/20 hover:border-primary">
          <!-- Google Icon SVG (Monochrome light) -->
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22c-.87-2.6-3.3-4.53-6.16-4.53z"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span class="font-label-caps tracking-widest text-[13px] font-bold">SIGN IN WITH GOOGLE</span>
        </a>
      </div>

      <!-- Decorative Cyber Details -->
      <div class="mt-8 pt-6 border-t border-zinc-800 flex justify-between items-center text-[10px] font-terminal-sm text-secondary-container">
        <div class="flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>GATEWAY ONLINE</span>
        </div>
        <div class="tracking-widest uppercase">
          SECURE://OAUTH2
        </div>
      </div>
    </div>
    
    <!-- Footer Branding -->
    <p class="text-center font-terminal-sm text-[11px] text-secondary-container mt-6">
      REDACT is registered privacy intelligence software. Authorized personnel only.
    </p>
  </div>
  
  <script>
    // Micro-interaction: Speed up scanline on hover
    const card = document.querySelector('.zinc-outline');
    const scanline = document.querySelector('.scanline');
    card.addEventListener('mouseenter', () => {
      if (scanline) {
        scanline.style.animationDuration = '1.5s';
        scanline.style.opacity = '0.5';
      }
    });
    card.addEventListener('mouseleave', () => {
      if (scanline) {
        scanline.style.animationDuration = '4s';
        scanline.style.opacity = '0.2';
      }
    });
  </script>
</body>
</html>
